<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Veto — Live Scene — The Entity Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ban-slash.css">
<style>
  :root { --bg:#070709; --panel:#121216; --line:#26262d; --text:#f2f2f4; --dim:#8b8b96; --red:#ff2a3d; --gold:#f5c542; }
  * { box-sizing:border-box; margin:0 }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:Barlow,system-ui,sans-serif; overflow:hidden }
  body.transparent { background:transparent } /* add ?bg=transparent for OBS overlays */
  .stage { height:100%; display:grid; grid-template-rows:auto 1fr auto; padding:3vh 3.5vw; gap:2.5vh;
    background:radial-gradient(ellipse at 50% -10%, #2a0a10 0%, transparent 60%) }
  .head { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:2vw }
  .team { font:800 clamp(28px,4.6vw,76px)/1 'Barlow Condensed',sans-serif; letter-spacing:.01em; transition:opacity .4s, color .4s }
  .team.b { text-align:right }
  .team.turn { color:var(--red) }
  .team.dim { opacity:.4 }
  .mid { text-align:center; font:600 clamp(14px,1.6vw,24px) Barlow; color:var(--dim); min-width:18vw }
  .mid strong { display:block; color:var(--text); font:700 clamp(18px,2.2vw,34px) 'Barlow Condensed'; margin-top:.3em }

  .body { position:relative; min-height:0 }
  .scene { position:absolute; inset:0; display:none }
  .scene.on { display:flex }

  /* ---------- toss ---------- */
  #toss { flex-direction:column; align-items:center; justify-content:center; gap:5vh; perspective:1400px }
  .coin-wrap { --d:min(28vh,26vw); width:var(--d); height:var(--d); position:relative; margin-top:14vh }
  .coin { position:absolute; inset:0; transform-style:preserve-3d }
  .coin s, .coin i { position:absolute; inset:0; border-radius:50%; display:block; text-decoration:none }
  .coin s { background:#b98a16; border:3px solid #8f6a0e }                       /* edge layers = thickness */
  .coin i { backface-visibility:hidden; display:grid; place-content:center; justify-items:center; gap:.1em; text-align:center;
    font:800 calc(var(--d)*.2)/1 'Barlow Condensed'; letter-spacing:.04em; color:#2b1d00;
    background:radial-gradient(circle at 32% 28%, #fff4b8, var(--gold) 42%, #a37a14 100%); border:calc(var(--d)*.035) solid #c99a1c;
    box-shadow:inset 0 0 0 calc(var(--d)*.04) rgba(255,255,255,.2), inset 0 0 calc(var(--d)*.12) rgba(120,80,0,.55) }
  .coin i::before { content:"✦"; font-size:.7em; opacity:.75 }
  .coin i.front { transform:translateZ(7px) }
  .coin i.back  { transform:rotateX(180deg) translateZ(7px) }
  .coin-shadow { position:absolute; left:10%; right:10%; bottom:-9vh; height:3.2vh; border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%); transform-origin:center }
  .coin-wrap::after { content:""; position:absolute; inset:-6%; border-radius:50%; border:4px solid var(--gold); opacity:0; pointer-events:none }

  .coin-wrap.throw { animation:arc 2.6s linear forwards }
  .coin-wrap.throw .coin { animation:spin 2.6s cubic-bezier(.15,.6,.25,1) forwards }
  .coin-wrap.throw .coin-shadow { animation:shade 2.6s linear forwards }
  .coin-wrap.heads { --end:2160deg } .coin-wrap.tails { --end:2340deg }       /* 6 spins = heads up, 6.5 = tails up */
  .coin-wrap.land::after { animation:ring .9s ease-out forwards }
  .coin-wrap.land .coin { filter:drop-shadow(0 0 40px rgba(245,197,66,.55)) }

  @keyframes arc {
    0%   { transform:translateY(0);     animation-timing-function:cubic-bezier(.2,.7,.3,1) }
    42%  { transform:translateY(-34vh); animation-timing-function:cubic-bezier(.7,0,.9,.4) }
    80%  { transform:translateY(0);     animation-timing-function:ease-out }
    90%  { transform:translateY(-4.5vh);animation-timing-function:ease-in }
    100% { transform:translateY(0) } }
  @keyframes spin  { from { transform:rotateX(0) } to { transform:rotateX(var(--end)) } }
  @keyframes shade { 0%,100% { transform:scale(1); opacity:1 } 42% { transform:scale(.35); opacity:.35 } 80% { transform:scale(1); opacity:1 } 90% { transform:scale(.8); opacity:.7 } }
  @keyframes ring  { from { transform:scale(.9); opacity:.9 } to { transform:scale(1.9); opacity:0 } }

  .toss-line { font:800 clamp(30px,6vh,80px) 'Barlow Condensed'; text-align:center; min-height:1.2em }
  .toss-line em { font-style:normal; color:var(--red) }
  .toss-line.dim { color:var(--dim); font-size:clamp(20px,3.4vh,44px); letter-spacing:.2em }
  .toss-line.pop { animation:pop .5s cubic-bezier(.2,1.4,.4,1) }
  .toss-result { font:700 clamp(18px,3vh,40px) 'Barlow Condensed'; letter-spacing:.2em; color:var(--gold); min-height:1.2em }
  @keyframes pop { from { transform:scale(.7); opacity:0 } to { transform:scale(1); opacity:1 } }

  /* ---------- veto ---------- */
  #veto { flex-direction:column; gap:2vh }
  .grid { flex:1; min-height:0; display:grid; gap:1.4vw; grid-template-columns:repeat(var(--cols,4),1fr); align-content:center }
  .map-card { position:relative; overflow:hidden; border:2px solid var(--line); background:var(--panel); aspect-ratio:16/10;
    display:flex; align-items:flex-end; transition:border-color .3s, transform .3s }
  .map-card .map-art { position:absolute; inset:0; background-size:cover; background-position:center; transition:filter .5s ease .25s }
  .map-card .map-art::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 40%, rgba(0,0,0,.85)) }
  .map-card .name { position:relative; padding:1.2vh 1.2vw; font:800 clamp(18px,2.6vw,42px)/1 'Barlow Condensed'; letter-spacing:.02em }
  .map-card .by { position:absolute; top:1vh; left:1vw; font:700 clamp(11px,1.1vw,16px) 'Barlow Condensed'; letter-spacing:.12em; color:var(--red);
    background:rgba(0,0,0,.65); padding:.3em .7em; display:none }
  .map-card.banned { border-color:#3a1218 }
  .map-card.banned .name { color:var(--dim) }
  .map-card.banned .by { display:block }
  .map-card.final { border-color:var(--gold); transform:scale(1.04) }

  /* ---------- final ---------- */
  #done { flex-direction:column; align-items:center; justify-content:center; gap:2vh; text-align:center }
  #done .label { font:600 clamp(16px,2vw,28px) Barlow; color:var(--dim) }
  #done .big { font:800 clamp(64px,16vh,200px)/.95 'Barlow Condensed'; color:var(--gold); animation:pop .7s cubic-bezier(.2,1.4,.4,1) }
  #done .vs { font:700 clamp(20px,3vw,44px) 'Barlow Condensed' }

  .foot { display:flex; justify-content:space-between; color:var(--dim); font:600 clamp(11px,1.1vw,15px) Barlow }
  .dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:#555; margin-right:.5em }
  .dot.live { background:var(--red); animation:blink 1.4s infinite }
  @keyframes blink { 50% { opacity:.25 } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-delay:0s !important } }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div class="team a" id="ta">Team A</div>
    <div class="mid"><span id="phase">Waiting for match</span><strong id="turn"></strong></div>
    <div class="team b" id="tb">Team B</div>
  </div>

  <div class="body">
    <section class="scene on" id="idle"><div class="toss-line" style="margin:auto;color:var(--dim)">Waiting for the match ceremony to start…</div></section>
    <section class="scene" id="toss">
      <div class="coin-wrap" id="coinwrap"><div class="coin" id="coin"></div><div class="coin-shadow"></div></div>
      <div class="toss-result" id="tossresult"></div>
      <div class="toss-line" id="tossline"></div>
    </section>
    <section class="scene" id="veto"><div class="grid" id="grid"></div></section>
    <section class="scene" id="done">
      <div class="label">The realm has been decided</div>
      <div class="big" id="finalmap"></div>
      <div class="vs" id="finalvs"></div>
    </section>
  </div>

  <div class="foot"><span><span class="dot" id="dot"></span><span id="conn">Not connected</span></span><span>The Entity Championship</span></div>
</div>

<script>
const STATE_KEY = 'entity-championship-state-v1';
const CHANNEL   = 'entity-championship-sync-v1';

/* Turns the controller's saved tournament state into what this scene needs. Never throws. */
function normalize(r) {
  if (!r || !Array.isArray(r.matches)) return null;
  const teams = r.teams || [];
  const match = r.matches.find(m => m.id === r.activeMatchId) || r.matches.find(m => m.status === 'in_progress') || r.matches.find(m => m.status === 'pending') || r.matches[0];
  if (!match) return null;
  const toss = match.toss || {}, veto = match.mapVeto || {};
  const teamN = id => teams.find(t => t.id === id)?.name || 'TBD';
  const A = match.teamAId, B = match.teamBId;
  const bans = (Array.isArray(veto.bans) ? veto.bans : []).map(b => typeof b === 'string' ? { map:b, teamId:null } : { map: b.map?.id ?? b.map?.name ?? b.map ?? b.id, teamId: b.teamId });
  const first = toss.winnerId || null, second = first === A ? B : A;
  const finalMap = veto.finalMap?.id ?? veto.finalMap?.name ?? veto.finalMap ?? null;
  return {
    teamAId: A, teamBId: B, teamAName: teamN(A), teamBName: teamN(B),
    coin: toss.side || null,
    tossWinnerId: first,
    pool: (veto.pool || []).map(m => typeof m === 'string' ? { id:m, name:m } : { id:m.id ?? m.name, name:m.name ?? m.id, image:m.image || m.img }),
    bans, finalMap,
    turn: first && !finalMap ? (bans.length % 2 === 0 ? first : second) : null,
    // stable per match + result: a re-save of the same toss must NOT replay the coin flip
    tossKey: `${match.id}:${toss.side || ''}:${first || ''}`
  };
}
async function loadRemote() { return null; }

const $ = id => document.getElementById(id);
const scenes = ['idle','toss','veto','done'];
let prev = { bans:new Set(), coinShown:null, scene:'idle' };
let current = null, lastNorm = null, tossBusy = false;

function show(name) { scenes.forEach(s => $(s).classList.toggle('on', s === name)); prev.scene = name; }
const teamName = (st, tId) => tId === st.teamAId ? st.teamAName : (tId === st.teamBId ? st.teamBName : 'TBD');

function render(st) {
  if (!st || (!st.pool.length && !st.coin && !st.tossWinnerId)) { if (!tossBusy) show('idle'); return; }
  $('ta').textContent = st.teamAName; $('tb').textContent = st.teamBName;
  const isA = t => t === st.teamAId, isB = t => t === st.teamBId;
  $('ta').classList.toggle('turn', isA(st.turn)); $('tb').classList.toggle('turn', isB(st.turn));
  $('ta').classList.toggle('dim', !!st.turn && !isA(st.turn)); $('tb').classList.toggle('dim', !!st.turn && !isB(st.turn));

  if (tossBusy) return;                         // let the flip finish; render(current) runs afterwards

  if (st.finalMap) {
    const m = st.pool.find(p => p.id === st.finalMap) || { name: st.finalMap };
    $('finalmap').textContent = m.name; $('finalvs').textContent = `${st.teamAName}  vs  ${st.teamBName}`;
    $('phase').textContent = 'Map locked'; $('turn').textContent = '';
    show('done'); syncBans(st, true); return;
  }
  if (!st.bans.length && st.coin && st.tossWinnerId && prev.coinShown !== st.tossKey) { runToss(st); return; }
  if (!st.pool.length) { show('idle'); return; }

  $('phase').textContent = 'Map veto';
  $('turn').textContent = st.turn ? `${teamName(st, st.turn)} to ban` : '';
  show('veto'); syncBans(st);
}

function buildCoin() {
  const c = $('coin'); if (c.dataset.built) return; c.dataset.built = 1;
  let h = ''; for (let z = -6; z <= 6; z += 2) h += `<s style="transform:translateZ(${z}px)"></s>`;
  c.innerHTML = h + '<i class="front">HEADS</i><i class="back">TAILS</i>';
}
function runToss(st) {
  tossBusy = true; prev.coinShown = st.tossKey;
  show('toss'); $('phase').textContent = 'Coin toss'; $('turn').textContent = '';
  buildCoin();
  const wrap = $('coinwrap'), line = $('tossline'), res = $('tossresult');
  const tails = String(st.coin).toLowerCase() === 'tails';
  wrap.className = 'coin-wrap'; res.textContent = '';
  line.className = 'toss-line dim'; line.textContent = 'FLIPPING…'; void wrap.offsetWidth;
  wrap.classList.add(tails ? 'tails' : 'heads', 'throw');
  setTimeout(() => { wrap.classList.add('land'); res.textContent = tails ? 'TAILS' : 'HEADS'; }, 2600);
  setTimeout(() => { line.className = 'toss-line pop'; line.innerHTML = `<em>${esc(teamName(st, st.tossWinnerId))}</em> wins the toss — bans first`; }, 3200);
  setTimeout(() => { tossBusy = false; render(current); }, 6000);
}

function syncBans(st, quiet) {
  const grid = $('grid');
  const cols = st.pool.length <= 4 ? st.pool.length : st.pool.length <= 8 ? 4 : 5;
  grid.style.setProperty('--cols', Math.max(cols, 1));
  const sig = st.pool.map(p => p.id).sort().join('|');   // order-independent: a reshuffled pool is not a new pool
  let rebuilt = false;
  if (grid.dataset.sig !== sig) {
    grid.dataset.sig = sig; rebuilt = true;
    grid.innerHTML = st.pool.map(p => `<div class="map-card" data-id="${esc(p.id)}">
      <div class="map-art" style="${p.image ? `background-image:url('${esc(p.image)}')` : `background:${hue(p.name)}`}"></div>
      <span class="by"></span><span class="name">${esc(p.name)}</span></div>`).join('');
  }
  const banned = new Map(st.bans.map(b => [b.map, b.teamId]));
  grid.querySelectorAll('.map-card').forEach(el => {
    const id = el.dataset.id, isBanned = banned.has(id), wasBanned = prev.bans.has(id);
    el.classList.toggle('banned', isBanned);
    el.classList.toggle('final', id === st.finalMap);
    el.classList.remove('just-banned');
    if (isBanned) el.querySelector('.by').textContent = 'BANNED · ' + teamName(st, banned.get(id));
    if (isBanned && !wasBanned && !quiet && !rebuilt) { void el.offsetWidth; el.classList.add('just-banned'); }  // animate only genuinely new bans
  });
  prev.bans = new Set(banned.keys());
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg,hsl(${h} 45% 22%),hsl(${(h+50)%360} 55% 12%))`; };

/* ---------- data wiring ---------- */
function ingest(raw) {
  try {
    const n = normalize(raw), k = JSON.stringify(n);
    if (k === lastNorm) return;                 // ignore saves that changed nothing we display (timestamps, heartbeats…)
    lastNorm = k; current = n; render(n);
  } catch (err) { console.error('toss-screen render failed', err); }
}
function readLocal() { try { return JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return null; } }
function setConn(ok, txt) { $('dot').classList.toggle('live', ok); $('conn').textContent = txt; }

const params = new URLSearchParams(location.search);
if (params.get('bg') === 'transparent') document.body.classList.add('transparent');

if (params.get('demo')) {
  setConn(true, 'Demo mode');
  const names = ['Ashfall','Citadel','Dunemark','Emberhold','Frostgate','Gloam','Hollow Keep'];
  const raw = { activeMatchId:'m1', teams:[{id:'t1',name:'Crimson Wolves'},{id:'t2',name:'Night Owls'}],
    matches:[{ id:'m1', teamAId:'t1', teamBId:'t2', status:'in_progress', toss:{}, mapVeto:{ pool:[], bans:[], finalMap:null } }] };
  const m = raw.matches[0], wait = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    ingest(raw); await wait(1200);
    m.toss = { side:'heads', winnerId:'t1' }; m.mapVeto.pool = names; ingest(raw); await wait(5600);
    for (let i = 0; i < 6; i++) {
      const left = names.filter(n => !m.mapVeto.bans.some(b => b.map === n));
      m.mapVeto.bans.push({ map:left[Math.floor(Math.random()*left.length)], teamId: i % 2 ? 't2' : 't1' });
      ingest(raw); await wait(2200);
    }
    m.mapVeto.finalMap = names.find(n => !m.mapVeto.bans.some(b => b.map === n)); ingest(raw);
  })();
} else {
  const sync = () => { const raw = readLocal(); ingest(raw); setConn(!!raw, raw ? 'Live' : 'Waiting for controller'); };
  sync();
  window.addEventListener('storage', e => { if (e.key === STATE_KEY || e.key === null) sync(); });
  // the controller's broadcast payload may be a ping, not the state — always re-read the saved state
  try { new BroadcastChannel(CHANNEL).onmessage = e => { const d = e.data; d && d.matches ? ingest(d) : sync(); }; } catch {}
  setInterval(async () => { const raw = (await loadRemote()) || readLocal(); ingest(raw); setConn(!!raw, raw ? 'Live' : 'Waiting for controller'); }, 1000);
}
</script>
</body>
</html>
