<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070709">
<title>Leaderboard — The Entity Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070709; --line:#2a2a33; --text:#f2f2f4; --dim:#8b8b96; --red:#ff2a3d; --green:#5fe0a0; --gold:#f5c542; --silver:#cfd4dc; --bronze:#d9925a;
          --cols:7% 9% minmax(0,1fr) 11% 11% 11% 11%; }
  * { box-sizing:border-box; margin:0 }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:Barlow,system-ui,sans-serif; overflow:hidden }
  body.transparent { background:transparent }                       /* ?bg=transparent for OBS */
  .stage { position:fixed; inset:0; display:flex; flex-direction:column; gap:2vh; padding:3.5vh 3.5vw 2.5vh;
           background:radial-gradient(ellipse at 50% -15%, #2a0a10 0%, transparent 62%) }
  body.transparent .stage { background:none }

  /* header */
  .head { position:relative; display:flex; justify-content:space-between; align-items:flex-end; gap:2vw; padding-bottom:1.6vh; border-bottom:1px solid var(--line) }
  .head::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,transparent,var(--red) 20%,#fff 50%,var(--red) 80%,transparent); background-size:220% 100%; animation:sheen 6s linear infinite }
  .head small { display:block; font:700 clamp(12px,1.2vw,18px) Barlow; letter-spacing:.22em; color:var(--red) }
  .head h1 { font:800 clamp(40px,7vh,96px)/.9 'Barlow Condensed'; letter-spacing:.04em; text-transform:uppercase; margin-top:.4vh }
  .chips { display:flex; gap:1.2vw }
  .chip { min-width:11vw; padding:1vh 1.2vw; border:1px solid var(--line); background:rgba(14,14,19,.85) }
  .chip small { color:var(--dim); letter-spacing:.18em; font-size:clamp(10px,.9vw,14px) }
  .chip b { display:block; margin-top:.4vh; font:800 clamp(22px,3.4vh,44px)/1 'Barlow Condensed'; letter-spacing:.04em }
  @keyframes sheen { from { background-position:220% 0 } to { background-position:-220% 0 } }

  /* column labels */
  .cols { display:grid; grid-template-columns:var(--cols); padding:0 1.4% 0 1.9%; color:var(--dim); font:700 clamp(10px,1vw,15px) Barlow; letter-spacing:.2em }
  .cols span:nth-child(n+4) { text-align:center }

  /* board */
  .board { position:relative; flex:1; min-height:0; container-type:size; --n:8 }
  .row { position:absolute; left:0; right:0; top:0; height:calc(100% / var(--n)); padding-bottom:calc(100cqh / var(--n) * .09);
         translate:0 calc(var(--i) * 100%); transition:translate .95s cubic-bezier(.65,0,.25,1);
         --fs:clamp(13px, calc(100cqh / var(--n) * .34), 44px); --acc:255,42,61; font-size:var(--fs) }
  .card { position:relative; height:100%; display:grid; grid-template-columns:var(--cols); grid-template-rows:minmax(0,1fr); align-items:center; padding:0 1.4%; overflow:hidden;
          background:linear-gradient(90deg,rgba(var(--acc),.14),rgba(16,16,21,.97) 42%); border:1px solid var(--line); border-left:.5cqw solid rgb(var(--acc)) }
  .card > * { position:relative; z-index:1 }
  .fill { position:absolute !important; z-index:0 !important; left:0; top:0; bottom:0; width:var(--w,0%); background:linear-gradient(90deg,rgba(var(--acc),.0),rgba(var(--acc),.2)); transition:width 1.1s cubic-bezier(.2,.8,.2,1) }
  .rank { font:800 calc(var(--fs)*2.1)/1 'Barlow Condensed'; color:#6d6d79; position:relative }
  .row.p1 .rank { color:var(--gold); text-shadow:0 0 26px rgba(245,197,66,.55) }
  .row.p2 .rank { color:var(--silver) } .row.p3 .rank { color:var(--bronze) }
  .delta { position:absolute; left:100%; top:50%; translate:.1em -50%; font:800 .55em Barlow; letter-spacing:.05em; animation:delta-in .5s ease both }
  .delta.up { color:var(--green) } .delta.down { color:var(--red) }
  .logo { height:84%; width:auto; aspect-ratio:1; justify-self:start; display:grid; place-items:center }
  .logo img { width:100%; height:100%; object-fit:contain; scale:1.15; filter:drop-shadow(0 4px 12px rgba(var(--acc),.45)) }
  .logo i { width:78%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font:800 1.2em 'Barlow Condensed'; font-style:normal; background:rgba(var(--acc),.25); border:2px solid rgb(var(--acc)) }
  .who { min-width:0; padding-left:.6em }
  .who b { display:block; font:800 calc(var(--fs)*1.6)/1 'Barlow Condensed'; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 24px rgba(var(--acc),.35) }
  .who span { display:inline-flex; align-items:center; gap:.45em; margin-top:.25em; font:700 .62em Barlow; letter-spacing:.2em; color:var(--dim) }
  .who span::before { content:""; width:.6em; height:.6em; border-radius:50%; background:var(--green) }
  .stat { text-align:center; font:800 calc(var(--fs)*1.6)/1 'Barlow Condensed'; font-variant-numeric:tabular-nums; letter-spacing:.03em }
  .stat.diff.pos { color:var(--green) } .stat.diff.neg { color:var(--red) } .stat.diff.zero { color:var(--dim) }
  .stat.pa { color:#a9a9b4 }

  .row.out .card { filter:saturate(.35) brightness(.7) } .row.out .who span::before { background:#5d5d6a }
  .row.live .card { border-color:var(--red); animation:live 2s ease-in-out infinite }
  .row.live .who span { color:#ff7884 } .row.live .who span::before { background:var(--red); animation:blink 1.2s infinite }
  .row.champ .card { border-color:var(--gold); border-left-color:var(--gold); background:linear-gradient(90deg,rgba(245,197,66,.2),rgba(16,16,21,.97) 50%); animation:champ 2.6s ease-in-out infinite }
  .row.champ .card::after { content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%); background-size:250% 100%; animation:scan 3.4s linear infinite }
  .row.champ .who span { color:var(--gold) } .row.champ .who span::before { background:var(--gold) }
  .row.moved .card { animation:moved 1.2s ease-out }

  .intro .card { animation:wipe .7s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--i) * 80ms + .2s) }

  @keyframes wipe { from { opacity:0; clip-path:inset(0 100% 0 0) } to { opacity:1; clip-path:inset(0) } }
  @keyframes live { 50% { box-shadow:0 0 34px rgba(255,42,61,.45) } }
  @keyframes champ { 50% { box-shadow:0 0 40px rgba(245,197,66,.4) } }
  @keyframes scan { from { background-position:250% 0 } to { background-position:-150% 0 } }
  @keyframes blink { 50% { opacity:.25 } }
  @keyframes moved { 0% { filter:brightness(1.9) } 100% { filter:brightness(1) } }
  @keyframes delta-in { from { opacity:0; translate:-.6em -50% } to { opacity:1; translate:.1em -50% } }
  .tick { animation:tick .55s cubic-bezier(.2,1.3,.4,1) }
  @keyframes tick { 0% { scale:1 } 35% { scale:1.35; color:var(--green) } 100% { scale:1 } }

  .idle { position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--dim); font:700 clamp(16px,2.2vw,32px) 'Barlow Condensed'; letter-spacing:.14em }
  .idle[hidden] { display:none }
  .foot { display:flex; justify-content:space-between; color:var(--dim); font:600 clamp(11px,1.1vw,15px) Barlow }
  .dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:#555; margin-right:.5em }
  .dot.live { background:var(--red); animation:blink 1.4s infinite }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important } }
</style>
</head>
<body>
<div class="stage">
  <header class="head">
    <div><small>THE ENTITY CHAMPIONSHIP · STANDINGS</small><h1>Leaderboard</h1></div>
    <div class="chips">
      <div class="chip"><small>TEAMS ALIVE</small><b id="alive">—</b></div>
      <div class="chip"><small>MATCHES PLAYED</small><b id="played">—</b></div>
    </div>
  </header>
  <div class="cols"><span>RANK</span><span></span><span>TEAM</span><span>W – L</span><span>POINTS</span><span>AGAINST</span><span>DIFF</span></div>
  <div class="board" id="board"><div class="idle" id="idle">THE LEADERBOARD APPEARS ONCE THE BRACKET IS GENERATED</div></div>
  <div class="foot"><span><span class="dot" id="dot"></span><span id="conn">Not connected</span></span><span>Ranked by wins, then point difference</span></div>
</div>

<script>
/* ===================================================================== CONFIG */
const STATE_KEY = 'entity-championship-state-v1';
const CHANNEL   = 'entity-championship-sync-v1';
const LOGO_DIR  = 'New Folder/';          // PNG folder, relative to this page (case-sensitive on Vercel)
const TEAMS = {                           // a word in the team's name → logo + accent colour (r,g,b)
  boys:{file:'Boys.png',acc:'245,197,24'}, eternity:{file:'eternity.png',acc:'139,123,255'}, hakle:{file:'Hakle.png',acc:'255,59,59'},
  nicesu:{file:'Nicesu.png',acc:'255,162,26'}, onyx:{file:'Onyx.png',acc:'166,120,255'}, vibes:{file:'Vibes.png',acc:'255,63,180'},
  vrty:{file:'Vrty.png',acc:'61,242,192'}, yo:{file:'Yo.png',acc:'255,122,46'}
};
/* Reading a match's scores/winner. The saved-state field names weren't visible to me, so several likely
   shapes are tried (scoreA/scoreB, totalA/totalB, pointsA/pointsB, result.*, scorecard.*). Edit these two
   functions if your saved matches use different names. */
const num = (x) => { const n = typeof x === 'number' ? x : parseFloat(x); return Number.isFinite(n) ? n : null; };
function scoresOf(m) {
  const pairs = [['scoreA','scoreB'],['totalA','totalB'],['pointsA','pointsB'],['a','b'],[m.teamAId, m.teamBId]];
  for (const src of [m, m.result, m.score, m.scores, m.totals, m.total, m.scorecard && m.scorecard.totals, m.scorecard]) {
    if (!src || typeof src !== 'object') continue;
    for (const [x, y] of pairs) { const a = num(src[x]), b = num(src[y]); if (a !== null && b !== null) return { a, b }; }
  }
  return null;
}
const isDone = (m) => /^(complete|completed|done|finished|final)$/i.test(m.status || '') || !!(m.winnerId || m.winner || (m.result && m.result.winnerId));
function winnerOf(m, sc) {
  let w = m.winnerId; if (!w && m.winner) w = typeof m.winner === 'object' ? m.winner.id : m.winner; if (!w && m.result) w = m.result.winnerId;
  if (w) return w;
  return sc && sc.a !== sc.b ? (sc.a > sc.b ? m.teamAId : m.teamBId) : null;
}
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const LIMIT = parseInt(params.get('limit'), 10) || 99;       // ?limit=8 shows the top 8 only
if (params.get('bg') === 'transparent') document.body.classList.add('transparent');

const findTeam = (name) => { for (const t of String(name || '').toLowerCase().split(/[^a-z0-9]+/)) if (t && TEAMS[t]) return TEAMS[t]; return null; };

function normalize(raw) {
  if (!raw || !Array.isArray(raw.teams) || !raw.teams.length) return null;
  const rows = new Map(raw.teams.map((t) => [t.id, { id:t.id, name:t.name || 'TBD', w:0, l:0, pf:0, pa:0, live:false, champ:false }]));
  const ms = Array.isArray(raw.matches) ? raw.matches : []; let total = 0, finished = 0;
  ms.forEach((m) => {
    const a = rows.get(m.teamAId), b = rows.get(m.teamBId); if (!a || !b) return;       // byes / empty slots
    total++;
    if (m.status === 'in_progress') a.live = b.live = true;
    if (!isDone(m)) return;
    finished++;
    const sc = scoresOf(m), w = winnerOf(m, sc);
    if (sc) { a.pf += sc.a; a.pa += sc.b; b.pf += sc.b; b.pa += sc.a; }
    if (w === a.id) { a.w++; b.l++; } else if (w === b.id) { b.w++; a.l++; }
  });
  const last = ms[ms.length - 1];                                                          // final = last match in the bracket
  if (last && rows.get(last.teamAId) && rows.get(last.teamBId) && isDone(last)) { const w = winnerOf(last, scoresOf(last)); if (rows.get(w)) rows.get(w).champ = true; }
  if (raw.championId && rows.get(raw.championId)) rows.get(raw.championId).champ = true;
  const list = [...rows.values()].map((r) => ({ ...r, out: !r.champ && r.l > 0, diff: r.pf - r.pa }));
  list.sort((x, y) => (y.champ - x.champ) || (y.w - x.w) || (x.out - y.out) || (y.diff - x.diff) || (y.pf - x.pf) || x.name.localeCompare(y.name));
  return { rows: list, alive: list.filter((r) => !r.out).length, teams: list.length, finished, total, maxPf: Math.max(1, ...list.map((r) => r.pf)) };
}

/* ---------- rendering (rows are keyed, so they glide to new positions) ---------- */
const board = $('board'), els = new Map(), ranks = new Map();
let first = true;

function tween(el, to, fmt) {
  const from = el.dataset.v === undefined ? to : Number(el.dataset.v);
  el.dataset.v = to; if (from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(); el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  (function step(t) { const k = Math.min(1, (t - t0) / 900); el.textContent = fmt(Math.round(from + (to - from) * k)); if (k < 1) requestAnimationFrame(step); })(t0);
}
const sgn = (n) => (n > 0 ? '+' : '') + n;

function make(r) {
  const team = findTeam(r.name), el = document.createElement('div'); el.className = 'row';
  el.style.setProperty('--acc', team ? team.acc : '255,42,61');
  const logo = team ? `<img alt="" src="${encodeURI(LOGO_DIR + team.file)}">` : `<i>${esc(r.name.slice(0, 2).toUpperCase())}</i>`;
  el.innerHTML = `<div class="card"><div class="fill"></div><div class="rank"></div><div class="logo">${logo}</div>
    <div class="who"><b>${esc(r.name)}</b><span></span></div>
    <div class="stat rec"></div><div class="stat pf"></div><div class="stat pa"></div><div class="stat diff"></div></div>`;
  const img = el.querySelector('img'); if (img) img.onerror = () => { img.replaceWith(Object.assign(document.createElement('i'), { textContent: r.name.slice(0, 2).toUpperCase() })); console.warn('[leaderboard] could not load', img.src); };
  return el;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(st) {
  $('idle').hidden = !!st;
  if (!st) { els.forEach((e) => e.remove()); els.clear(); $('alive').textContent = $('played').textContent = '—'; return; }
  const list = st.rows.slice(0, LIMIT);
  board.style.setProperty('--n', Math.max(list.length, 1));
  if (first) { board.classList.add('intro'); setTimeout(() => board.classList.remove('intro'), 2600 + list.length * 80); }
  list.forEach((r, i) => {
    let el = els.get(r.id); if (!el) { el = make(r); els.set(r.id, el); board.appendChild(el); }
    el.style.setProperty('--i', i);
    el.className = 'row' + (i < 3 ? ' p' + (i + 1) : '') + (r.champ ? ' champ' : '') + (r.out ? ' out' : '') + (r.live ? ' live' : '') + (el.classList.contains('moved') ? ' moved' : '');
    el.querySelector('.rank').firstChild ? (el.querySelector('.rank').firstChild.nodeValue = i + 1) : el.querySelector('.rank').append(String(i + 1));
    el.querySelector('.who span').textContent = r.champ ? 'CHAMPION' : r.live ? 'LIVE NOW' : r.out ? 'ELIMINATED' : 'STILL ALIVE';
    el.querySelector('.rec').textContent = r.w + ' – ' + r.l;
    tween(el.querySelector('.pf'), r.pf, String); tween(el.querySelector('.pa'), r.pa, String);
    const d = el.querySelector('.diff'); tween(d, r.diff, sgn); d.className = 'stat diff ' + (r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : 'zero');
    el.querySelector('.fill').style.setProperty('--w', (r.pf / st.maxPf * 100) + '%');
    const was = ranks.get(r.id);
    if (!first && was !== undefined && was !== i) {                                   // rank moved: arrow + flash
      el.querySelectorAll('.delta').forEach((x) => x.remove());
      const dl = document.createElement('span'); dl.className = 'delta ' + (i < was ? 'up' : 'down'); dl.textContent = (i < was ? '▲' : '▼') + Math.abs(was - i);
      el.querySelector('.rank').appendChild(dl); setTimeout(() => dl.remove(), 8000);
      el.classList.remove('moved'); void el.offsetWidth; el.classList.add('moved'); setTimeout(() => el.classList.remove('moved'), 1300);
    }
    ranks.set(r.id, i);
  });
  els.forEach((el, id) => { if (!list.some((r) => r.id === id)) { el.remove(); els.delete(id); } });
  $('alive').textContent = st.alive + ' / ' + st.teams; $('played').textContent = st.finished + ' / ' + st.total;
  first = false;
}

/* ---------- data wiring ---------- */
let lastNorm = null;
function ingest(raw) {
  try { const n = normalize(raw), k = JSON.stringify(n); if (k === lastNorm) return; lastNorm = k; render(n); }
  catch (err) { console.error('leaderboard render failed', err); }
}
const readLocal = () => { try { return JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return null; } };
const setConn = (ok, txt) => { $('dot').classList.toggle('live', ok); $('conn').textContent = txt; };

if (params.get('demo')) {                                                                // ?demo=1 plays a fake 8-team tournament
  setConn(true, 'Demo mode');
  const names = ['The Boys','Eternity','Hakle','Nicesu','Onyx','Vibes','Vrty','Yo'];
  const raw = { teams: names.map((n, i) => ({ id:'t' + i, name:n })), matches: [] };
  const mk = (id, a, b) => ({ id, teamAId:a, teamBId:b, status:'pending' });
  raw.matches = [mk('m1','t0','t1'), mk('m2','t2','t3'), mk('m3','t4','t5'), mk('m4','t6','t7'), mk('m5',null,null), mk('m6',null,null), mk('m7',null,null)];
  const feed = { m1:['m5','teamAId'], m2:['m5','teamBId'], m3:['m6','teamAId'], m4:['m6','teamBId'], m5:['m7','teamAId'], m6:['m7','teamBId'] };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    ingest(raw); await wait(2500);
    for (const m of raw.matches) {
      m.status = 'in_progress'; ingest(raw); await wait(2200);
      const a = 20 + Math.floor(Math.random() * 20), b = 20 + Math.floor(Math.random() * 20) + 1;
      Object.assign(m, { status:'completed', scoreA:a, scoreB:a === b ? b + 1 : b }); m.winnerId = m.scoreA > m.scoreB ? m.teamAId : m.teamBId;
      if (feed[m.id]) raw.matches.find((x) => x.id === feed[m.id][0])[feed[m.id][1]] = m.winnerId;
      ingest(raw); await wait(2600);
    }
  })();
} else {
  const sync = () => { const raw = readLocal(); ingest(raw); setConn(!!raw, raw ? 'Live' : 'Waiting for controller'); };
  sync();
  window.addEventListener('storage', (e) => { if (e.key === STATE_KEY || e.key === null) sync(); });
  try { new BroadcastChannel(CHANNEL).onmessage = (e) => { e.data && e.data.teams ? ingest(e.data) : sync(); }; } catch {}
  setInterval(sync, 1000);
}
</script>
</body>
</html>
