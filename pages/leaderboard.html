<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070709">
<title>Leaderboard — The VNC Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<script defer src="../shared/supabase-config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="../shared/shared.js"></script>
<style>
  :root { --bg:#070709; --line:#2a2a33; --text:#f2f2f4; --dim:#8b8b96; --red:#ff2a3d; --green:#5fe0a0; --gold:#f5c542; --silver:#cfd4dc; --bronze:#d9925a;
          --cols:5.5% 6% minmax(0,1fr) repeat(3,11%) 9% 6.5% 6.5% 10%; }
  * { box-sizing:border-box; margin:0 }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:Barlow,system-ui,sans-serif; overflow:hidden }
  body.transparent { background:transparent }                       /* ?bg=transparent for OBS */
  .stage { position:fixed; inset:0; display:flex; flex-direction:column; gap:1.8vh; padding:3.2vh 3vw 2.2vh;
           background:radial-gradient(ellipse at 50% -15%, #2a0a10 0%, transparent 62%) }
  body.transparent .stage { background:none }

  .head { position:relative; display:flex; justify-content:space-between; align-items:flex-end; gap:2vw; padding-bottom:1.4vh; border-bottom:1px solid var(--line) }
  .head::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,transparent,var(--red) 20%,#fff 50%,var(--red) 80%,transparent); background-size:220% 100%; animation:sheen 6s linear infinite }
  .head small { display:block; font:700 clamp(11px,1.1vw,17px) Barlow; letter-spacing:.22em; color:var(--red) }
  .head h1 { font:800 clamp(36px,6.4vh,88px)/.9 'Barlow Condensed'; letter-spacing:.04em; text-transform:uppercase; margin-top:.4vh }
  .chips { display:flex; gap:1vw }
  .chip { min-width:10vw; padding:.9vh 1.1vw; border:1px solid var(--line); background:rgba(14,14,19,.85) }
  .chip small { color:var(--dim); letter-spacing:.18em; font-size:clamp(9px,.85vw,13px) }
  .chip b { display:block; margin-top:.3vh; font:800 clamp(20px,3.2vh,40px)/1 'Barlow Condensed'; letter-spacing:.04em }
  @keyframes sheen { from { background-position:220% 0 } to { background-position:-220% 0 } }

  .cols { display:grid; grid-template-columns:var(--cols); padding:0 1.2% 0 1.7%; color:var(--dim); font:700 clamp(10px,.95vw,14px) Barlow; letter-spacing:.2em }
  .cols span:nth-child(n+4) { text-align:center }
  .cols span.cur { color:var(--red) }

  .board { position:relative; flex:1; min-height:0; container-type:size; --n:8 }
  .row { position:absolute; left:0; right:0; top:0; height:calc(100% / var(--n)); padding-bottom:calc(100cqh / var(--n) * .08);
         translate:0 calc(var(--i) * 100%); transition:translate .95s cubic-bezier(.65,0,.25,1);
         --fs:clamp(12px, calc(100cqh / var(--n) * .32), 40px); --acc:255,42,61; font-size:var(--fs) }
  .card { position:relative; height:100%; display:grid; grid-template-columns:var(--cols); grid-template-rows:minmax(0,1fr); align-items:center; padding:0 1.2%; overflow:hidden;
          background:linear-gradient(90deg,rgba(var(--acc),.14),rgba(16,16,21,.97) 40%); border:1px solid var(--line); border-left:.5cqw solid rgb(var(--acc)) }
  .cells { display:contents }
  .rank { font:800 calc(var(--fs)*2)/1 'Barlow Condensed'; color:#6d6d79; position:relative }
  .row.p1 .rank { color:var(--gold); text-shadow:0 0 26px rgba(245,197,66,.55) } .row.p2 .rank { color:var(--silver) } .row.p3 .rank { color:var(--bronze) }
  .delta { position:absolute; left:100%; top:50%; translate:.1em -50%; font:800 .5em Barlow; animation:delta-in .5s ease both }
  .delta.up { color:var(--green) } .delta.down { color:var(--red) }
  .logo { height:84%; width:auto; aspect-ratio:1; justify-self:start; display:grid; place-items:center }
  .logo img { width:100%; height:100%; object-fit:contain; scale:1.15; filter:drop-shadow(0 4px 12px rgba(var(--acc),.45)) }
  .logo i { width:78%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font:800 1.1em 'Barlow Condensed'; font-style:normal; background:rgba(var(--acc),.25); border:2px solid rgb(var(--acc)) }
  .who { min-width:0; padding-left:.5em }
  .who b { display:block; font:800 calc(var(--fs)*1.5)/1 'Barlow Condensed'; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 24px rgba(var(--acc),.35) }
  .who span { display:inline-flex; align-items:center; gap:.45em; margin-top:.25em; font:700 .56em Barlow; letter-spacing:.2em; color:var(--dim) }
  .who span::before { content:""; width:.6em; height:.6em; border-radius:50%; background:var(--green) }

  /* per-round points: the "succession" */
  .cell { height:74%; margin:0 .22em; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.18em; min-width:0; border:1px solid transparent; position:relative }
  .cell b { font:800 calc(var(--fs)*1.45)/1 'Barlow Condensed'; font-variant-numeric:tabular-nums }
  .cell small { max-width:94%; font:700 calc(var(--fs)*.44)/1 Barlow; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .cell.win { background:rgba(95,224,160,.12); border-color:rgba(95,224,160,.4) }
  .cell.loss { background:rgba(255,42,61,.07); border-color:rgba(255,42,61,.28) } .cell.loss b { color:#a9a9b4 }
  .cell.live { border-color:var(--red); animation:live 2s ease-in-out infinite } .cell.live b { color:#ff7884; font-size:calc(var(--fs)*1.1) }
  .cell.bye { border:1px dashed rgba(245,197,66,.55) } .cell.bye b { color:var(--gold); font-size:calc(var(--fs)*1.1) }
  .cell.next, .cell.none { color:#5d5d6a } .cell.next b, .cell.none b { color:#4b4b57; font-size:calc(var(--fs)*1.1) } .cell.next { border:1px dashed #33333d }
  .cell.fresh { animation:fresh 1.5s ease-out }

  .stat { text-align:center; font:800 calc(var(--fs)*1.5)/1 'Barlow Condensed'; font-variant-numeric:tabular-nums }
  .stat.tot { font-size:calc(var(--fs)*2); color:#fff; text-shadow:0 0 22px rgba(var(--acc),.4) }
  .stat.rec { font-size:calc(var(--fs)*1.2); color:#c6c6d0 }
  .stat.diff.pos { color:var(--green) } .stat.diff.neg { color:var(--red) } .stat.diff.zero { color:var(--dim) }
  .spark { height:62%; padding:0 .4em } .spark svg { width:100%; height:100%; overflow:visible }
  .spark polyline { fill:none; stroke:rgb(var(--acc)); stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(var(--acc),.7)) }
  .spark circle { fill:#fff; stroke:rgb(var(--acc)); stroke-width:2 } .spark line { stroke:#2e2e38; stroke-width:1 }

  .row.out .card { filter:saturate(.35) brightness(.72) } .row.out .who span::before { background:#5d5d6a }
  .row.live .card { border-color:var(--red) } .row.live .who span { color:#ff7884 } .row.live .who span::before { background:var(--red); animation:blink 1.2s infinite }
  .row.champ .card { border-color:var(--gold); border-left-color:var(--gold); background:linear-gradient(90deg,rgba(245,197,66,.2),rgba(16,16,21,.97) 50%); animation:champ 2.6s ease-in-out infinite }
  .row.champ .card::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%); background-size:250% 100%; animation:scan 3.4s linear infinite }
  .row.champ .who span { color:var(--gold) } .row.champ .who span::before { background:var(--gold) }
  .row.moved .card { animation:moved 1.2s ease-out }
  .intro .card { animation:wipe .7s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--i) * 80ms + .2s) }

  @keyframes wipe { from { opacity:0; clip-path:inset(0 100% 0 0) } to { opacity:1; clip-path:inset(0) } }
  @keyframes live { 50% { box-shadow:0 0 22px rgba(255,42,61,.5) } }
  @keyframes champ { 50% { box-shadow:0 0 40px rgba(245,197,66,.4) } }
  @keyframes scan { from { background-position:250% 0 } to { background-position:-150% 0 } }
  @keyframes blink { 50% { opacity:.25 } }
  @keyframes moved { 0% { filter:brightness(1.9) } 100% { filter:brightness(1) } }
  @keyframes fresh { 0% { box-shadow:0 0 0 0 rgba(95,224,160,.9); scale:1.18 } 100% { box-shadow:0 0 0 18px rgba(95,224,160,0); scale:1 } }
  @keyframes delta-in { from { opacity:0; translate:-.6em -50% } to { opacity:1; translate:.1em -50% } }
  .tick { animation:tick .55s cubic-bezier(.2,1.3,.4,1) } @keyframes tick { 35% { scale:1.35; color:var(--green) } }

  .idle { position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--dim); font:700 clamp(16px,2.2vw,32px) 'Barlow Condensed'; letter-spacing:.14em } .idle[hidden] { display:none }
  .foot { display:flex; justify-content:space-between; color:var(--dim); font:600 clamp(11px,1vw,14px) Barlow }
  .dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:#555; margin-right:.5em } .dot.live { background:var(--red); animation:blink 1.4s infinite }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important } }
</style>
</head>
<body>
<div class="stage">
  <header class="head">
    <div><small>THE VNC TRIALS · COMPLETE TABLE</small><h1>Leaderboard</h1></div>
    <div class="chips">
      <div class="chip"><small>CURRENT ROUND</small><b id="round">—</b></div>
      <div class="chip"><small>TEAMS ALIVE</small><b id="alive">—</b></div>
      <div class="chip"><small>MATCHES PLAYED</small><b id="played">—</b></div>
    </div>
  </header>
  <div class="cols" id="cols"></div>
  <div class="board" id="board"><div class="idle" id="idle">THE LEADERBOARD APPEARS ONCE THE BRACKET IS GENERATED</div></div>
  <div class="foot"><span><span class="dot" id="dot"></span><span id="conn">Not connected</span></span><span>Points per round → running total · ranked by wins, then total points</span></div>
</div>

<script>
/* ===================================================================== CONFIG */
const STATE_KEY = 'entity-championship-state-v1';
const CHANNEL   = 'entity-championship-sync-v1';
/* Where the team logos live. Tried in order until one loads (the first that works is remembered).
   "/Images/" = project root on your deployed site, "../Images/" = one level up from this page. */
const LOGO_DIRS = ['/Images/', '../Images/', 'Images/', '/images/', '../images/', 'images/'];
const TEAMS = {                           // a word in the team's name → logo file + accent colour (r,g,b)
  boys:{file:'Boys.png',acc:'245,197,24'}, hakle:{file:'Hakle.png',acc:'255,59,59'},
  nicesu:{file:'Nicesu.png',acc:'255,162,26'}, onyx:{file:'Onyx.png',acc:'166,120,255'}, vibes:{file:'Vibes.png',acc:'255,63,180'},
  vrty:{file:'Vrty.png',acc:'61,242,192'}, yo:{file:'Yo.png',acc:'255,122,46'}
};
/* Reading a match's scores/winner — several likely field names are tried. Edit these two functions if your
   saved matches use different names. */
const num = (x) => { const n = typeof x === 'number' ? x : parseFloat(x); return Number.isFinite(n) ? n : null; };
function scoresOf(m) {
  const pairs = [['scoreA','scoreB'],['totalA','totalB'],['pointsA','pointsB'],['a','b'],[m.teamAId, m.teamBId]];
  for (const src of [m, m.result, m.score, m.scores, m.totals, m.total, m.scorecard && m.scorecard.totals, m.scorecard]) {
    if (!src || typeof src !== 'object') continue;
    for (const [x, y] of pairs) { const a = num(src[x]), b = num(src[y]); if (a !== null && b !== null) return { a, b }; }
  }
  return null;
}
const isDone = (m) => /^(complete|completed|done|finished|final)$/i.test(m.status || '') || !!(m.winnerId || m.winner || (m.result && m.result.winnerId));
function winnerOf(m, sc) {
  let w = m.winnerId; if (!w && m.winner) w = typeof m.winner === 'object' ? m.winner.id : m.winner; if (!w && m.result) w = m.result.winnerId;
  if (w) return w;
  return sc && sc.a !== sc.b ? (sc.a > sc.b ? m.teamAId : m.teamBId) : null;
}
/* ===================================================================== */

const $ = (id) => document.getElementById(id), esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search), LIMIT = parseInt(params.get('limit'), 10) || 99;
if (params.get('bg') === 'transparent') document.body.classList.add('transparent');
const findTeam = (name) => { for (const t of String(name || '').toLowerCase().split(/[^a-z0-9]+/)) if (t && TEAMS[t]) return TEAMS[t]; return null; };

/* ---------- logo loading: tries each folder + name casing until the image really loads ---------- */
const logoCache = new Map(); let goodDir = null;
const variants = (f) => { const b = f.replace(/\.\w+$/, ''); return [...new Set([f, b[0].toUpperCase() + b.slice(1).toLowerCase() + '.png', b.toLowerCase() + '.png', b.toUpperCase() + '.png'])]; };
const probe = (u) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = u; });
function resolveLogo(team) {
  if (!logoCache.has(team.file)) logoCache.set(team.file, (async () => {
    for (const d of [goodDir, ...LOGO_DIRS].filter((x, i, a) => x && a.indexOf(x) === i))
      for (const n of variants(team.file)) { const u = encodeURI(d + n); if (await probe(u)) { goodDir = d; return u; } }
    console.warn('[leaderboard] logo not found:', team.file, '— tried', LOGO_DIRS); return null;
  })());
  return logoCache.get(team.file);
}

/* ---------- standings + per-round table ---------- */
const labelFor = (r, R) => (r === R - 1 ? 'FINAL' : r === R - 2 ? 'SEMIS' : r === R - 3 ? 'QUARTERS' : 'ROUND ' + (r + 1));
function normalize(raw) {
  if (!raw || !Array.isArray(raw.teams) || !raw.teams.length) return null;
  const rows = new Map(raw.teams.map((t) => [t.id, { id:t.id, name:t.name || 'TBD', w:0, l:0, pf:0, pa:0, live:false, champ:false, open:false, last:null, cells:[] }]));
  // A round can hold two matches for one team (a rematch): keep the earlier result on the cell as history.
  const putCell = (t, r, cell) => { const old = t.cells[r]; if (old) { const h = [...(old.hist || [])]; if (old.s === 'win' || old.s === 'loss') h.push({ s:old.s, pts:old.pts, oppPts:old.oppPts, opp:old.opp }); if (h.length) cell.hist = h; } t.cells[r] = cell; };
  const ms = Array.isArray(raw.matches) ? raw.matches : [];
  const p = 2 ** Math.ceil(Math.log2(Math.max(2, raw.teams.length))), sizes = []; for (let s = p / 2; s >= 1; s /= 2) sizes.push(s);
  const rounds = ms.map((m) => (Number.isInteger(m.round) ? m.round : Number.isInteger(m.roundIndex) ? m.roundIndex : null)), base = Math.min(...rounds.filter((x) => x !== null));
  const roundOf = (m, i) => { if (rounds[i] !== null) return rounds[i] - base; let acc = 0; for (let r = 0; r < sizes.length; r++) { acc += sizes[r]; if (i < acc) return r; } return sizes.length - 1; };
  const R = Math.max(1, ...ms.map((m, i) => roundOf(m, i) + 1)); let total = 0, finished = 0, curRound = -1;

  ms.forEach((m, i) => {
    const r = roundOf(m, i), a = rows.get(m.teamAId), b = rows.get(m.teamBId);
    if (!a || !b) { const t = a || b; if (t && !t.cells[r]) t.cells[r] = r === 0 ? { s:'bye' } : { s:'next', opp:'' }; if (t && !isDone(m)) t.open = true; return; }   // lone team: bye in round 1, otherwise waiting
    total++;
    const live = m.status === 'in_progress'; if (live) { a.live = b.live = true; }
    if (!isDone(m)) { a.open = b.open = true; putCell(a, r, { s: live ? 'live' : 'next', opp:b.name }); putCell(b, r, { s: live ? 'live' : 'next', opp:a.name }); if (curRound < 0 || r < curRound) curRound = r; return; }
    finished++;
    const sc = scoresOf(m), w = winnerOf(m, sc);
    if (sc) { a.pf += sc.a; a.pa += sc.b; b.pf += sc.b; b.pa += sc.a; }
    if (w === a.id) { a.w++; b.l++; a.last = 'w'; b.last = 'l'; } else if (w === b.id) { b.w++; a.l++; b.last = 'w'; a.last = 'l'; }
    putCell(a, r, { s: w === a.id ? 'win' : 'loss', pts: sc ? sc.a : null, oppPts: sc ? sc.b : null, opp:b.name });
    putCell(b, r, { s: w === b.id ? 'win' : 'loss', pts: sc ? sc.b : null, oppPts: sc ? sc.a : null, opp:a.name });
  });
  const last = ms[ms.length - 1];
  if (last && rows.get(last.teamAId) && rows.get(last.teamBId) && isDone(last)) { const w = winnerOf(last, scoresOf(last)); if (rows.get(w)) rows.get(w).champ = true; }
  if (raw.championId && rows.get(raw.championId)) rows.get(raw.championId).champ = true;

  const list = [...rows.values()].map((t) => {
    let run = 0; const cum = [0];                                               // running total after each finished round
    for (let r = 0; r < R; r++) { const c = t.cells[r]; if (c && (c.s === 'win' || c.s === 'loss')) { run += (c.pts || 0) + (c.hist || []).reduce((n, h) => n + (h.pts || 0), 0); cum.push(run); }
      else if (c && c.hist && c.hist.length) { run += c.hist.reduce((n, h) => n + (h.pts || 0), 0); cum.push(run); } else if (c && c.s === 'bye') cum.push(run); else break; }
    const cells = []; let dead = false;
    for (let r = 0; r < R; r++) { const c = t.cells[r]; if (dead) cells.push({ s:'none' }); else { cells.push(c || { s:'none' }); if (c && c.s === 'loss') dead = true; } }
    return { ...t, cells, cum, out: !t.champ && t.last === 'l' && !t.open, rematch: !t.champ && t.l > 0 && t.last === 'l' && t.open, diff: t.pf - t.pa };
  });
  list.sort((x, y) => (y.champ - x.champ) || (y.w - x.w) || (x.out - y.out) || (y.pf - x.pf) || (y.diff - x.diff) || x.name.localeCompare(y.name));
  return { rows: list, R, labels: Array.from({ length: R }, (_, r) => labelFor(r, R)), curRound: curRound < 0 ? R - 1 : curRound,
           alive: list.filter((r) => !r.out).length, teams: list.length, finished, total, maxPf: Math.max(1, ...list.map((r) => r.pf)) };
}

/* ---------- rendering (rows are keyed, so they glide to new positions) ---------- */
const board = $('board'), els = new Map(), ranks = new Map(); let first = true, lastR = 0;
function tween(el, to, fmt) {
  const from = el.dataset.v === undefined ? to : Number(el.dataset.v); el.dataset.v = to;
  if (from === to) { el.textContent = fmt(to); return; }
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); const t0 = performance.now();
  (function step(t) { const k = Math.min(1, (t - t0) / 900); el.textContent = fmt(Math.round(from + (to - from) * k)); if (k < 1) requestAnimationFrame(step); })(t0);
}
const sgn = (n) => (n > 0 ? '+' : '') + n;
const histHtml = (c) => (c.hist || []).map((h) => `<small class="hist" style="opacity:.65">earlier ${h.pts ?? '?'}–${h.oppPts ?? '?'} ${h.s === 'win' ? 'beat' : 'lost to'} ${esc(h.opp)}</small>`).join('');
const cellHtml = (c) => ({ win:`<b>${c.pts ?? '✓'}</b><small>beat ${esc(c.opp)}</small>${histHtml(c)}`, loss:`<b>${c.pts ?? '✕'}</b><small>lost to ${esc(c.opp)}</small>`,
  live:`<b>LIVE</b><small>vs ${esc(c.opp)}</small>${histHtml(c)}`, bye:`<b>BYE</b><small>advanced</small>`, next:`<b>${(c.hist && c.hist.length) ? 'REMATCH' : '—'}</b><small>${c.opp ? 'vs ' + esc(c.opp) : 'waiting'}</small>${histHtml(c)}`, none:`<b>—</b>` }[c.s]);
function spark(cum, R, max) {
  const W = 100, H = 36, x = (i) => 4 + i * (W - 8) / R, y = (v) => H - 5 - (v / max) * (H - 10), pts = cum.map((v, i) => x(i) + ',' + y(v)), e = cum.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="4" y1="${H - 5}" x2="${W - 4}" y2="${H - 5}"/>${cum.length > 1 ? `<polyline points="${pts.join(' ')}"/>` : ''}<circle cx="${x(e)}" cy="${y(cum[e])}" r="3.2"/></svg>`;
}
function make(r) {
  const team = findTeam(r.name), el = document.createElement('div'); el.className = 'row'; el.style.setProperty('--acc', team ? team.acc : '255,42,61');
  el.innerHTML = `<div class="card"><div class="rank"></div><div class="logo"><i>${esc(r.name.slice(0, 2).toUpperCase())}</i></div>
    <div class="who"><b>${esc(r.name)}</b><span></span></div><div class="cells"></div>
    <div class="stat tot"></div><div class="stat rec"></div><div class="stat diff"></div><div class="spark"></div></div>`;
  if (team) resolveLogo(team).then((u) => { if (u) el.querySelector('.logo').innerHTML = `<img alt="" src="${u}">`; });
  return el;
}
function render(st) {
  $('idle').hidden = !!st;
  if (!st) { els.forEach((e) => e.remove()); els.clear(); $('cols').innerHTML = ''; $('alive').textContent = $('played').textContent = $('round').textContent = '—'; return; }
  const list = st.rows.slice(0, LIMIT);
  if (st.R !== lastR) { lastR = st.R; document.documentElement.style.setProperty('--cols', `5.5% 6% minmax(0,1fr) repeat(${st.R}, calc(33% / ${st.R})) 9% 6.5% 6.5% 10%`); }
  $('cols').innerHTML = '<span>RANK</span><span></span><span>TEAM</span>' + st.labels.map((l, r) => `<span class="${r === st.curRound ? 'cur' : ''}">${l}</span>`).join('') + '<span>TOTAL</span><span>W – L</span><span>DIFF</span><span>PROGRESSION</span>';
  board.style.setProperty('--n', Math.max(list.length, 1));
  if (first) { board.classList.add('intro'); setTimeout(() => board.classList.remove('intro'), 2600 + list.length * 80); }
  list.forEach((r, i) => {
    let el = els.get(r.id); if (!el) { el = make(r); els.set(r.id, el); board.appendChild(el); }
    el.style.setProperty('--i', i);
    el.className = 'row' + (i < 3 ? ' p' + (i + 1) : '') + (r.champ ? ' champ' : '') + (r.out ? ' out' : '') + (r.live ? ' live' : '') + (el.classList.contains('moved') ? ' moved' : '');
    const rk = el.querySelector('.rank'); rk.firstChild ? (rk.firstChild.nodeValue = i + 1) : rk.append(String(i + 1));
    el.querySelector('.who span').textContent = r.champ ? 'CHAMPION' : r.live ? 'LIVE NOW' : r.out ? 'ELIMINATED' : r.rematch ? 'REMATCH PENDING' : 'STILL ALIVE';
    const prevSig = el._sig || [], sig = r.cells.map((c) => c.s + ':' + (c.pts ?? '') + ':' + ((c.hist || []).length));
    el.querySelector('.cells').innerHTML = r.cells.map((c) => `<div class="cell ${c.s}">${cellHtml(c)}</div>`).join('');
    el.querySelectorAll('.cell').forEach((c, k) => { if (!first && /^(win|loss)/.test(sig[k]) && sig[k] !== prevSig[k]) c.classList.add('fresh'); });   // a new round result lands
    el._sig = sig;
    tween(el.querySelector('.tot'), r.pf, String); el.querySelector('.rec').textContent = r.w + ' – ' + r.l;
    const d = el.querySelector('.diff'); tween(d, r.diff, sgn); d.className = 'stat diff ' + (r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : 'zero');
    el.querySelector('.spark').innerHTML = spark(r.cum, st.R, st.maxPf);
    const was = ranks.get(r.id);
    if (!first && was !== undefined && was !== i) {
      el.querySelectorAll('.delta').forEach((x) => x.remove());
      const dl = document.createElement('span'); dl.className = 'delta ' + (i < was ? 'up' : 'down'); dl.textContent = (i < was ? '▲' : '▼') + Math.abs(was - i);
      rk.appendChild(dl); setTimeout(() => dl.remove(), 8000);
      el.classList.remove('moved'); void el.offsetWidth; el.classList.add('moved'); setTimeout(() => el.classList.remove('moved'), 1300);
    }
    ranks.set(r.id, i);
  });
  els.forEach((el, id) => { if (!list.some((r) => r.id === id)) { el.remove(); els.delete(id); } });
  $('alive').textContent = st.alive + ' / ' + st.teams; $('played').textContent = st.finished + ' / ' + st.total; $('round').textContent = st.labels[st.curRound];
  first = false;
}

/* ---------- data wiring ---------- */
let lastNorm = null;
function ingest(raw) { try { const n = normalize(raw), k = JSON.stringify(n); if (k === lastNorm) return; lastNorm = k; render(n); } catch (err) { console.error('leaderboard render failed', err); } }
const readLocal = () => { try { if (window.Entity) return Entity.load(); return JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return null; } };
const setConn = (ok, txt) => { $('dot').classList.toggle('live', ok); $('conn').textContent = txt; };

if (params.get('demo')) {                                                                // ?demo=1 plays a fake 7-team tournament
  setConn(true, 'Demo mode');
  const names = ['The Boys','Hakle','Nicesu','Onyx','Vibes','Vrty','Yo'], wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const mk = (id, a, b) => ({ id, teamAId:a, teamBId:b, status:'pending' });
  const raw = { teams: names.map((n, i) => ({ id:'t' + i, name:n })), matches:[mk('m1','t0','t1'), mk('m2','t2','t3'), mk('m3','t4','t5'), mk('m4','t6',null), mk('m5',null,null), mk('m6',null,null), mk('m7',null,null)] };
  const feed = { m1:['m5','teamAId'], m2:['m5','teamBId'], m3:['m6','teamAId'], m4:['m6','teamBId'], m5:['m7','teamAId'], m6:['m7','teamBId'] };
  (async () => {
    ingest(raw); await wait(2500);
    for (const m of raw.matches) {
      if (!m.teamAId || !m.teamBId) { const w = m.teamAId || m.teamBId; if (w && feed[m.id]) raw.matches.find((x) => x.id === feed[m.id][0])[feed[m.id][1]] = w; ingest(raw); continue; }   // bye
      m.status = 'in_progress'; ingest(raw); await wait(2200);
      const a = 20 + Math.floor(Math.random() * 20), b = 20 + Math.floor(Math.random() * 20); Object.assign(m, { status:'completed', scoreA:a, scoreB:a === b ? b + 1 : b });
      m.winnerId = m.scoreA > m.scoreB ? m.teamAId : m.teamBId;
      if (feed[m.id]) raw.matches.find((x) => x.id === feed[m.id][0])[feed[m.id][1]] = m.winnerId;
      ingest(raw); await wait(2600);
    }
  })();
} else {
  const sync = () => { const raw = readLocal(); ingest(raw); setConn(!!raw, raw ? 'Live' : 'Waiting for controller'); };
  sync(); window.addEventListener('storage', (e) => { if (e.key === STATE_KEY || e.key === null) sync(); });
  window.addEventListener('entity-state-change', sync); window.addEventListener('load', sync);
  try { new BroadcastChannel(CHANNEL).onmessage = (e) => { e.data && e.data.teams ? ingest(e.data) : sync(); }; } catch {}
  setInterval(sync, 1000);
}
</script>
